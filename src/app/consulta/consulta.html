<div fxLayout="row" fxLayoutAlign="center">
    <div fxLayout="column" fxFlex="1000px">
        <form class="mt-60" #buscaForm="ngForm" (ngSubmit)="pesquisar()">
            <mat-card appearance="outlined">
                <mat-card-header>
                    <mat-card-title>Consulta</mat-card-title>
                </mat-card-header>
                <mat-card-content class="mt-20">
                    <div fxLayout="row">
                        <div fxLayout="column">
                            <mat-form-field>
                                <mat-label>Nome*:</mat-label>
                                <input name="nomeBusca" [(ngModel)]="nomeBusca" matInput placeholder="ex: josé">
                            </mat-form-field>
                        </div>
                    </div>
                </mat-card-content>
                <mat-card-actions>
                    <button mat-flat-button color="primary" type="submit">
                        <mat-icon fontIcon="search"></mat-icon>
                        Pesquisar
                    </button>
                </mat-card-actions>
            </mat-card>
        </form>
    </div>
</div>

<div fxLayout="row" fxLayoutAlign="center" class="mt-20">
    <div fxLayout="column" fxFlex="1000px">
        <mat-card appearance="outlined">
            <mat-card-header>
                <mat-card-title>Resultado</mat-card-title>
            </mat-card-header>
            <mat-card-content>
                <table mat-table [dataSource]="listaClientes">
                    <ng-container matColumnDef="id">
                        <th mat-header-cell *matHeaderCellDef>ID</th>
                        <td mat-cell *matCellDef="let cliente">{{cliente.id}}</td>
                    </ng-container>   

                    <ng-container matColumnDef="nome">
                        <th mat-header-cell *matHeaderCellDef>Nome</th>
                        <td mat-cell *matCellDef="let cliente">{{cliente.nome}}</td>
                    </ng-container>  

                    <ng-container matColumnDef="cpf">
                        <th mat-header-cell *matHeaderCellDef>CPF</th>
                        <td mat-cell *matCellDef="let cliente">{{cliente.cpf}}</td>
                    </ng-container>  
                        
                    <ng-container matColumnDef="datanascimento">
                        <th mat-header-cell *matHeaderCellDef>Data de Nascimento</th>
                        <td mat-cell *matCellDef="let cliente">{{cliente.datanascimento}}</td>
                    </ng-container>  

                    <ng-container matColumnDef="email">
                        <th mat-header-cell *matHeaderCellDef>Email</th>
                        <td mat-cell *matCellDef="let cliente">{{cliente.email}}</td>
                    </ng-container>  

                    <ng-container matColumnDef="acoes">
                        <th mat-header-cell *matHeaderCellDef>Ações</th>
                        <td mat-cell *matCellDef="let cliente">
                            
                            <!-- Exibe os botões de Editar e Deletar apenas se o cliente atual NÃO estiver selecionado para deletar -->
                            @if (clienteSelecionado?.id !== cliente.id) {
                                <button color="primary" type="button" mat-button (click)="preparaEditar(cliente.id)">
                                    <mat-icon fontIcon="edit"></mat-icon>
                                    Editar
                                </button>

                                <button color="warn" type="button" mat-button (click)="preparandoDeletar(cliente)">
                                    <mat-icon fontIcon="delete"></mat-icon>
                                    Deletar
                                </button>
                            } @else {
                                <!-- Exibe a confirmação e botão de cancelar apenas na linha do cliente selecionado -->
                                <button color="warn" type="button" mat-button (click)="confirmarDeletar()">
                                    <mat-icon fontIcon="check"></mat-icon>
                                    Confirmar
                                </button>

                                <button type="button" mat-button (click)="cancelarDeletar()">
                                    <mat-icon fontIcon="close"></mat-icon>
                                    Cancelar
                                </button>
                            }

                        </td>
                    </ng-container>

                    <tr mat-header-row *matHeaderRowDef="colunasTabela"></tr>
                    <tr mat-row *matRowDef="let cliente; columns: colunasTabela"></tr>
                </table>
            </mat-card-content>
        </mat-card>
    </div>
</div>
